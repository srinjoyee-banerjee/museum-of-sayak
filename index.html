<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="entrance">

        <!-- SAYAK'S PHOTOGRAPH -->
        <img
            src="sayak_bkgnd.jpeg"
            alt="Sayak"
            class="entrance-photo"
        >

        <!-- CINEMATIC OVERLAY -->
        <div class="entrance-overlay"></div>


        <!-- LEFT SIDE CONTENT -->
        <section class="entrance-content">

            <div class="small-title">
                A PRIVATE COLLECTION
            </div>

            <h1>
                THE MUSEUM
                <br>
                <em>OF SAYAK</em>
            </h1>

            <p class="tagline">
                exploring you,<br>
                through my eyes.
            </p>

            <button id="enterBtn">
                <span>ENTER THE MUSEUM</span>
                <b>↗</b>
            </button>

        </section>


        <!-- BOTTOM -->
        <div class="year">
            2026
        </div>

        <div class="edition">
            ONE PERSON · TWENTY-SIX MOMENTS
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
