<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="entrance">

        <!-- Sayak's photograph -->
        <div class="photo"></div>

        <!-- Cinematic darkness over the photograph -->
        <div class="shade"></div>

        <!-- Small museum label -->
        <div class="museum-label">
            PRIVATE COLLECTION
        </div>

        <!-- Main introduction -->
        <section class="intro">

            <div class="line"></div>

            <p class="eyebrow">
                AN EXHIBITION OF ONE
            </p>

            <h1>
                The Museum<br>
                <span>of Sayak</span>
            </h1>

            <p class="subtitle">
                exploring you,<br>
                through my eyes.
            </p>

            <button id="enterBtn">
                <span>ENTER EXHIBITION</span>
                <strong>↗</strong>
            </button>

        </section>

        <!-- Bottom information -->
        <div class="bottom-note">
            <span>01</span>
            <span>BEGINNING</span>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
