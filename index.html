<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Museum of Sayak</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

```
<!-- =========================
     ENTRANCE
========================== -->

<section id="entrance" class="screen active">

    <img
        src="sayak_bkgnd.jpeg"
        class="entrance-photo"
        alt="Sayak"
    >

    <div class="entrance-overlay"></div>

    <div class="entrance-content">

        <div class="entrance-kicker">
            A PRIVATE COLLECTION
        </div>

        <h1>
            THE MUSEUM
            <em>OF SAYAK</em>
        </h1>

        <p>
            exploring you,<br>
            through my eyes.
        </p>

        <button id="enterBtn">
            ENTER THE MUSEUM
            <span>↗</span>
        </button>

    </div>

    <div class="entrance-footer">
        2026
        <span>ONE PERSON · TWENTY-SIX MOMENTS</span>
    </div>

</section>


<!-- =========================
     MUSEUM
========================== -->

<section id="museum" class="screen">

    <div class="room-background"></div>
    <div class="room-light"></div>
    <div class="film-grain"></div>


    <!-- TOP -->

    <header class="museum-top">

        <div class="museum-mark">
            THE MUSEUM<br>
            OF SAYAK
        </div>

        <div id="roomNumber">
            CHAPTER 1
        </div>

    </header>


    <!-- DOOR TRANSITION -->

    <div id="doors" class="doors">

        <div class="door door-left"></div>
        <div class="door door-right"></div>

        <div class="door-title">
            <span>ENTERING</span>
            <strong id="doorChapter">
                CHAPTER 1
            </strong>
        </div>

    </div>


    <!-- EXHIBIT -->

    <main id="exhibit">

        <div class="chapter-intro">

            <div class="chapter-small">
                CHAPTER 1
            </div>

            <h2 id="chapterTitle">
                WHO ARE YOU?
            </h2>

            <div class="chapter-line"></div>

        </div>

    </main>


    <!-- NAVIGATION -->

    <div class="museum-navigation">

        <button id="prevBtn">
            ←
        </button>

        <div class="moment">
            <span id="momentCurrent">01</span>
            <i>/</i>
            <span>26</span>
        </div>

        <button id="nextBtn">
            NEXT
            <span>→</span>
        </button>

    </div>


    <!-- MUSIC -->

    <button id="soundBtn">
        ♪ SOUND ON
    </button>

</section>
```

</div>

<audio id="music" loop preload="auto">
    <source src="mp3.mpeg" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
