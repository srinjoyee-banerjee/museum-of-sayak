```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- =========================
             OPENING / COVER
        ========================== -->

        <section id="cover" class="screen cover-screen">

            <img
                src="sayak_bkgnd.jpeg"
                class="cover-photo"
                alt="Sayak"
            >

            <div class="cover-dark"></div>

            <div class="cover-content">

                <div class="small-label">
                    A PRIVATE COLLECTION
                </div>

                <h1>
                    THE MUSEUM
                    <br>
                    <em>OF SAYAK</em>
                </h1>

                <p>
                    exploring you,<br>
                    through my eyes.
                </p>

                <button id="enterBtn">
                    ENTER THE MUSEUM
                    <span>↗</span>
                </button>

                <div class="cover-bottom">
                    2026
                    <span>ONE PERSON · TWENTY-SIX MOMENTS</span>
                </div>

            </div>

        </section>


        <!-- =========================
             MUSEUM DOORS
        ========================== -->

        <section id="doors" class="screen doors-screen hidden">

            <div class="museum-title">
                THE MUSEUM OF SAYAK
            </div>

            <div class="doors">

                <div class="door door-left"></div>
                <div class="door door-right"></div>

                <div class="door-center">
                    <span>ENTERING</span>
                    <strong>THE MUSEUM</strong>
                </div>

            </div>

        </section>


        <!-- =========================
             MAIN MUSEUM
        ========================== -->

        <main id="museum" class="hidden">

            <div id="scene"></div>

            <div class="navigation">

                <button id="previousBtn">
                    ←
                </button>

                <div class="counter">
                    <span id="currentNumber">01</span>
                    <span class="slash">/</span>
                    <span>26</span>
                </div>

                <button id="nextBtn">
                    →
                </button>

            </div>

            <div class="sound-control">
                <button id="soundBtn">
                    ♪ SOUND ON
                </button>
            </div>

        </main>


        <!-- =========================
             MUSIC
        ========================== -->

        <audio
            id="music"
            src="mp3.mpeg"
            loop
            preload="auto">
        </audio>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
