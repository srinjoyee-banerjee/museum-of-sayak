<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         PAGE 1 — ENTRANCE
    ====================================== -->

    <main class="entrance" id="entrance">

        <img
            class="sayak-photo"
            src="sayak_bkgnd.jpeg"
            alt="Sayak"
        >

        <div class="photo-overlay"></div>

        <section class="intro">

            <h1>
                THE MUSEUM
                <br>
                <span>OF SAYAK</span>
            </h1>

            <p>
                exploring you,<br>
                through my eyes.
            </p>

            <button id="enterBtn" type="button">
                ENTER
                <span>↗</span>
            </button>

        </section>

        <div class="collection">
            PRIVATE COLLECTION · 2026
        </div>

    </main>


    <!-- =====================================
         PAGE 2 — MUSEUM
         Same page. No redirect.
    ====================================== -->

    <section class="museum" id="museum">

        <!-- Background -->
        <div class="museum-background"></div>

        <!-- Dark overlay -->
        <div class="museum-overlay"></div>


        <!-- Chapter content -->

        <div class="chapter">

            <div class="chapter-meta">
                <span id="chapterNumber">01</span>
                <span class="meta-line"></span>
                <span>10</span>
            </div>


            <div class="chapter-content">

                <div class="chapter-text">

                    <p class="chapter-label" id="chapterLabel">
                        CHAPTER 01
                    </p>

                    <h2 id="chapterTitle">
                        Loading...
                    </h2>

                    <p
                        class="chapter-description"
                        id="chapterDescription">
                    </p>

                </div>


                <div class="chapter-visual">

                    <div class="image-frame">

                        <img
                            id="chapterImage"
                            src=""
                            alt="Sayak"
                        >

                    </div>

                </div>

            </div>


            <!-- Navigation -->

            <div class="chapter-navigation">

                <button
                    id="prevBtn"
                    type="button">
                    ←
                </button>

                <div class="chapter-progress">
                    <span id="progressNumber">01</span>
                    <span class="progress-line"></span>
                    <span>10</span>
                </div>

                <button
                    id="nextBtn"
                    type="button">
                    →
                </button>

            </div>

        </div>


        <!-- Music -->

        <button
            id="musicBtn"
            class="music-button"
            type="button">

            <span class="music-icon">♪</span>
            <span id="musicText">SOUND ON</span>

        </button>


        <!-- Exit / back -->

        <button
            id="backBtn"
            class="back-button"
            type="button">

            ← BACK

        </button>

    </section>


    <!-- =====================================
         MUSIC
    ====================================== -->

    <audio
        id="museumMusic"
        src="mp3.mpeg"
        loop>
    </audio>


    <script src="script.js"></script>

</body>

</html>
