<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="entrance">

        <!-- SAYAK -->
        <img
            class="sayak-photo"
            src="sayak_bkgnd.jpeg"
            alt="Sayak"
        >

        <div class="photo-overlay"></div>

        <!-- TITLE -->
        <section class="intro">

            <div class="eyebrow">
                AN EXHIBITION OF ONE
            </div>

            <h1>
                THE MUSEUM
                <br>
                <em>OF SAYAK</em>
            </h1>

            <p>
                exploring you,<br>
                through my eyes.
            </p>

            <button id="enterBtn">
                ENTER
                <span>↗</span>
            </button>

        </section>

        <div class="collection">
            PRIVATE COLLECTION · 2026
        </div>

    </main>

    <script src="script.js"></script>

</html>
