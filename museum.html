<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="museum">

        <div class="museum-background"></div>

        <div class="museum-dark"></div>


        <!-- CHAPTER DOOR -->

        <section class="chapter-door">

            <div class="chapter-number">
                01
            </div>

            <div class="chapter-label">
                CHAPTER
            </div>

            <h1>
                WHO ARE YOU?
            </h1>

            <p>
                Enter the first room.
            </p>

            <button id="chapterEnter">
                ENTER
                <span>↗</span>
            </button>

        </section>


        <!-- MUSIC -->

        <audio id="backgroundMusic" loop>
            <source src="mp3.mpeg" type="audio/mpeg">
        </audio>


    </main>


    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const music =
                document.getElementById("backgroundMusic");

            const button =
                document.getElementById("chapterEnter");


            button.addEventListener("click", () => {

                music.play().catch(() => {});

                button.innerHTML = "OPENING...";

            });

        });

    </script>

</body>

</html>
