<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="museum">

        <!-- =====================================
             CINEMATIC BACKGROUND
        ====================================== -->

        <div id="museumImage"></div>
        <div class="museum-vignette"></div>
        <div class="museum-grain"></div>


        <!-- =====================================
             TOP NAVIGATION
        ====================================== -->

        <header class="museum-header">

            <div class="museum-name">
                THE MUSEUM OF SAYAK
            </div>

            <div class="progress">
                <span id="currentPage">01</span>
                <i></i>
                <span>26</span>
            </div>

        </header>


        <!-- =====================================
             MAIN EXHIBITION
        ====================================== -->

        <section class="exhibition">

            <div class="chapter-number" id="chapterNumber">
                CHAPTER 01
            </div>

            <h1 id="chapterTitle">
                WHO ARE YOU?
            </h1>

            <div class="exhibit-layout">

                <!-- PHOTOGRAPH -->
                <div class="photograph-frame">

                    <div class="frame-inner">

                        <img
                            id="chapterImage"
                            src=""
                            alt="Sayak"
                        >

                    </div>

                    <div
                        class="photograph-caption"
                        id="photoCaption">
                    </div>

                </div>


                <!-- WRITING -->
                <div class="writing">

                    <div
                        class="text-number"
                        id="textNumber">
                        01
                    </div>

                    <p id="chapterText">
                        You are someone I keep discovering,
                        even after all these years.
                    </p>

                </div>

            </div>

        </section>


        <!-- =====================================
             CHAPTER DOOR
        ====================================== -->

        <section
            id="chapterDoor"
            class="chapter-door hidden">

            <div class="door-number" id="doorNumber">
                01
            </div>

            <div class="door-small">
                NEXT ROOM
            </div>

            <h2 id="doorTitle">
                WHO ARE YOU?
            </h2>

            <button id="openDoor">
                ENTER
                <span>↗</span>
            </button>

        </section>


        <!-- =====================================
             NAVIGATION
        ====================================== -->

        <nav class="museum-navigation">

            <button id="backBtn">
                ←
            </button>

            <button id="nextBtn">
                →
            </button>

        </nav>


        <!-- =====================================
             SOUND
        ====================================== -->

        <div class="sound-control">

            <button id="soundBtn">
                ♪ SOUND ON
            </button>

        </div>


        <!-- =====================================
             BACK
        ====================================== -->

        <button
            id="exitBtn"
            class="exit-museum">
            ← EXIT
        </button>


        <!-- =====================================
             MUSIC
        ====================================== -->

        <audio
            id="music"
            src="mp3.mpeg"
            loop
            preload="auto">
        </audio>


        <!-- =====================================
             LOADING
        ====================================== -->

        <div id="loading">

            <div class="loading-line"></div>

            <p>
                ENTERING THE MUSEUM
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
