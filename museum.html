<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="museum">

        <!-- Background -->
        <div class="museum-background"></div>
        <div class="museum-vignette"></div>
        <div class="museum-grain"></div>


        <!-- Top -->
        <header class="museum-top">

            <div class="museum-title">
                THE MUSEUM OF SAYAK
            </div>

            <div class="counter">
                <span id="currentNumber">01</span>
                <span>/</span>
                <span>10</span>
            </div>

        </header>


        <!-- Main -->
        <section class="museum-content">

            <!-- LEFT -->
            <div class="text-side">

                <div class="chapter-number" id="chapterNumber">
                    CHAPTER 01
                </div>

                <h1 id="chapterTitle">
                    WHO ARE YOU?
                </h1>

                <div class="little-line"></div>

                <p id="chapterText">
                    You are someone I keep discovering,
                    even after all these years.
                </p>

            </div>


            <!-- RIGHT -->
            <div class="image-side">

                <div class="image-wrapper">

                    <img
                        id="chapterImage"
                        src="strong.jpeg"
                        alt="Sayak"
                    >

                </div>

                <div class="image-counter">
                    <span id="photoNumber">01</span>
                </div>

            </div>

        </section>


        <!-- Bottom navigation -->
        <div class="bottom-navigation">

            <button id="prevBtn">
                ←
            </button>

            <div class="progress">
                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>
            </div>

            <button id="nextBtn">
                →
            </button>

        </div>


        <!-- Sound -->
        <button
            class="sound-button"
            id="musicBtn"
        >
            ♪
            <span id="soundText">SOUND ON</span>
        </button>


        <!-- Back -->
        <button
            class="back-button"
            id="backBtn"
        >
            ← BACK
        </button>

    </main>


    <audio
        id="museumMusic"
        src="mp3.mpeg"
        loop
        preload="auto"
    ></audio>


    <script src="script.js"></script>

</body>
</html>
