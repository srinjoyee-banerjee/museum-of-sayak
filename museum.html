<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Museum of Sayak</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main id="museum">


    <!-- =========================================
         MUSEUM ENTRANCE
    ========================================== -->

    <section id="museumEntrance">


        <!-- LIGHT BEHIND THE DOORS -->

        <div class="door-light"></div>


        <!-- LEFT DOOR -->

        <div class="museum-door door-left">

            <div class="door-panel">

                <span>THE</span>

                <strong>MUSEUM</strong>

                <span>OF SAYAK</span>

            </div>

        </div>


        <!-- RIGHT DOOR -->

        <div class="museum-door door-right">

            <div class="door-panel">

                <span>PRIVATE</span>

                <strong>COLLECTION</strong>

                <span>2026</span>

            </div>

        </div>


        <!-- CENTER TEXT -->

        <div class="door-title">

            <div class="door-number">
                01
            </div>

            <p>
                ENTERING THE MUSEUM
            </p>

        </div>


    </section>



    <!-- =========================================
         ACTUAL MUSEUM
    ========================================== -->

    <section id="museumInside">

        <div class="museum-background"></div>

        <div class="museum-dark"></div>

        <div class="museum-grain"></div>


        <header class="museum-header">

            <div class="museum-name">
                THE MUSEUM OF SAYAK
            </div>

            <div class="progress">

                <span id="currentPage">
                    01
                </span>

                <i></i>

                <span>
                    26
                </span>

            </div>

        </header>


        <section class="exhibition">

            <div
                class="chapter-number"
                id="chapterNumber"
            >
                CHAPTER 01
            </div>


            <h1 id="chapterTitle">
                WHO ARE YOU?
            </h1>


            <div class="exhibit-layout">


                <div class="photograph-frame">

                    <div class="frame-inner">

                        <img
                            id="chapterImage"
                            src=""
                            alt="Sayak"
                        >

                    </div>

                    <div
                        class="photograph-caption"
                        id="photoCaption"
                    ></div>

                </div>


                <div class="writing">

                    <div
                        class="text-number"
                        id="textNumber"
                    >
                        01
                    </div>

                    <p id="chapterText"></p>

                </div>


            </div>

        </section>


        <!-- CHAPTER DOOR -->

        <section
            id="chapterDoor"
            class="chapter-door hidden"
        >

            <div
                class="door-number"
                id="doorNumber"
            >
                02
            </div>

            <div class="door-small">
                NEXT ROOM
            </div>

            <h2 id="doorTitle">
                THE LITTLE THINGS
            </h2>

            <button id="openDoor">

                ENTER

                <span>↗</span>

            </button>

        </section>


        <!-- NAVIGATION -->

        <nav class="museum-navigation">

            <button id="backBtn">
                ←
            </button>

            <button id="nextBtn">
                →
            </button>

        </nav>


        <!-- SOUND -->

        <div class="sound-control">

            <button id="soundBtn">
                ♪ SOUND ON
            </button>

        </div>


        <!-- EXIT -->

        <button
            id="exitBtn"
            class="exit-museum"
        >
            ← EXIT
        </button>


        <!-- MUSIC -->

        <audio
            id="music"
            src="mp3.mpeg"
            loop
            preload="auto"
        ></audio>


    </section>


</main>


<script src="script.js"></script>

</body>

</html>
